[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "adapol"
version = "0.2.0"
authors = [
  { name="Zhen Huang", email="hertz@berkeley.edu" },
  { name="Chia-Nan Yeh", email="cyeh@flatironinstitute.org"},
  { name="Nils Wentzell", email="nwentzell@flatironinstitute.org"},
  { name="Jason Kaye", email="jkaye@flatironinstitute.org"},
  { name="Lin Lin", email="linlin@berkeley.edu"},
  { name="Hugo U. R. Strand", email="hugo.strand@oru.se"}
]
description = "Adaptive Pole Fitting for Quantum Many-Body Physics "
readme = "README.md"
keywords = ["Bath", "Fitting", "Hybridization", "DMFT", "Matsubara"]
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
]

[project.urls]
"Homepage" = "https://flatironinstitute.github.io/adapol"
"Bug Tracker" = "https://github.com/flatironinstitute/adapol/issues"

[tool.ruff.lint]
# Pin the rule set explicitly. Without this ruff lints with whatever its current
# defaults are, which change between releases and silently break CI.
# This is ruff's classic default (pycodestyle errors + pyflakes) plus import sorting.
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    "E701",  # multiple statements on one line (colon), used for compact guards
    "E702",  # multiple statements on one line (semicolon), used in plot scripts
    "E731",  # lambda assignment
    "E741",  # ambiguous variable name, e.g. `I` for the identity matrix
]

[tool.ruff.lint.per-file-ignores]
# Benchmarks and example notebooks are exploratory scripts, not library code.
"benchmarks/*" = ["F401", "F841", "I001"]
"doc/examples/*.ipynb" = ["E402", "F401", "I001"]

[tool.ruff.lint.isort]
# Match the existing one-import-per-line style.
force-single-line = true
