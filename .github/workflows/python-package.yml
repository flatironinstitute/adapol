# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main", "0.1.x", "0.2.x" ]
  pull_request:
    branches: [ "main", "0.1.x", "0.2.x" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip3 install pytest numpy scipy sphinx sphinx-rtd-theme nbsphinx ipython myst-parser linkify-it-py
    - name: Lint with Ruff
      run: |
        pip install ruff==0.16.3
        ruff check --output-format=github .
    - name: Test with pytest
      run: |
        pip install -e .
        pytest -m "not triqs"

    - name: Build Documention
      run: |
        cd doc
        make html

    - name: Deploy documentation to website
      if: matrix.python-version == '3.12' && (github.ref == 'refs/heads/0.1.x' || github.ref == 'refs/heads/0.2.x')
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: doc/_build/html
        branch: github.io
        target-folder: docs/${{ github.ref_name }}
